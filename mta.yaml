modules:
  - name: dispatchernsdispatcherproj-destination-content
    type: com.sap.application.content
    requires:
      - name: dispatchernsdispatcherproj-destination-service
        parameters:
          content-target: true
      - name: dispatchernsdispatcherproj-repo-host
        parameters:
          service-key:
            name: dispatchernsdispatcherproj-repo-host-key
      - name: dispatchernsdispatcherproj-uaa
        parameters:
          service-key:
            name: dispatchernsdispatcherproj-uaa-key
    parameters:
      content:
        instance:
          destinations:
            - Name: dispatchernsdispatcherproj_html_repo_host
              ServiceInstanceName: dispatchernsdispatcherproj-html5-service
              ServiceKeyName: dispatchernsdispatcherproj-repo-host-key
              sap.cloud.service: dispatchernsdispatcherproj
            - Authentication: OAuth2UserTokenExchange
              Name: dispatchernsdispatcherproj_uaa
              ServiceInstanceName: dispatchernsdispatcherproj-xsuaa-service
              ServiceKeyName: dispatchernsdispatcherproj-uaa-key
              sap.cloud.service: dispatchernsdispatcherproj
          existing_destinations_policy: update
    build-parameters:
      no-source: true
  - name: dispatchernsdispatcherproj-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: dispatchernsdispatcherproj-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - dispatchernsdispatcherproj.zip
          name: dispatchernsdispatcherproj
          target-path: resources/
  - name: dispatchernsdispatcherproj
    type: html5
    path: .
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []
resources:
  - name: dispatchernsdispatcherproj-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: dispatchernsdispatcherproj-destination-service
      service-plan: lite
  - name: dispatchernsdispatcherproj-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-name: dispatchernsdispatcherproj-xsuaa-service
      service-plan: application
  - name: dispatchernsdispatcherproj-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: dispatchernsdispatcherproj-html5-service
      service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
